name: Release

# Build the image once, publish it to GHCR by digest, and record a
# release-manifest.json artifact per docs/cloud/CONTRACTS.md section 4.
# Deployment is a separate, opt-in workflow (deploy.yml).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short sha
        id: shortsha
        run: echo "sha12=$(echo '${{ github.sha }}' | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/neal-systems/mcp-gateway
          tags: |
            type=sha,format=short
            type=raw,value=sha-${{ steps.shortsha.outputs.sha12 }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: ./app
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Write release manifest
        id: manifest
        run: |
          set -euo pipefail
          release_id="sha-${{ steps.shortsha.outputs.sha12 }}"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          builder="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python3 - "$release_id" "${{ steps.build.outputs.digest }}" "${{ github.sha }}" "$built_at" "$builder" <<'PYEOF'
          import json, sys
          release_id, digest, git_sha, built_at, builder = sys.argv[1:6]
          manifest = {
              "schema": 1,
              "release_id": release_id,
              "image": f"ghcr.io/neal-systems/mcp-gateway@{digest}",
              "git_sha": git_sha,
              "built_at": built_at,
              "builder": builder,
          }
          with open("release-manifest.json", "w") as fh:
              json.dump(manifest, fh, indent=2)
              fh.write("\n")
          print(json.dumps(manifest, indent=2))
          PYEOF
          {
            echo "### Release manifest"
            echo '```json'
            cat release-manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest
          path: release-manifest.json
          retention-days: 30
